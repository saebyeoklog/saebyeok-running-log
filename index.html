<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>새벽의 러닝 이야기</title>
  <style>
    :root{
      --bg:#f6f7fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb;
      --accent:#111827; --ok:#065f46; --okbg:#ecfdf5;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
      background:var(--bg); color:var(--text);
    }
    .wrap{max-width:1100px; margin:0 auto; padding:16px;}
    .card{
      background:var(--card); border:1px solid var(--line); border-radius:18px;
      padding:16px; margin-bottom:16px;
    }
    .topbar{
      display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap;
    }
    h1{margin:0 0 8px; font-size:28px;}
    .sub{margin:0; color:var(--muted);}
    .tabs{
      display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px;
    }
    .tab{
      border:1px solid var(--line); background:#fff; color:var(--text);
      border-radius:12px; padding:10px 12px; cursor:pointer; white-space:nowrap;
    }
    .tab.active{background:var(--accent); color:#fff;}
    .hidden{display:none;}
    .grid{display:grid; gap:12px;}
    .grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
    .grid.cols-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
    label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
    input, select, textarea{
      width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:12px;
      font-size:14px; background:#fff;
    }
    textarea{min-height:96px; resize:vertical;}
    button{
      border:0; border-radius:12px; padding:10px 14px; background:var(--accent);
      color:#fff; cursor:pointer; font-size:14px;
    }
    button.secondary{background:#fff; color:var(--text); border:1px solid var(--line);}
    .stats{
      display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px;
    }
    .stat .label{color:var(--muted); font-size:13px;}
    .stat .value{font-size:24px; font-weight:700; margin-top:6px;}
    .status-pill{
      display:inline-block; border-radius:999px; padding:6px 12px; font-size:13px; font-weight:600;
    }
    .status-on{background:var(--okbg); color:var(--ok); border:1px solid #a7f3d0;}
    .status-off{background:#f9fafb; color:#6b7280; border:1px solid #e5e7eb;}
    .helper{color:var(--muted); font-size:13px; margin-top:8px;}
    .entry{
      border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; background:#fff;
    }
    .entry-title{font-size:18px; font-weight:700;}
    .badges{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0;}
    .badge{
      border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:12px; background:#f9fafb;
    }
    .meta{display:flex; flex-wrap:wrap; gap:10px 14px; color:var(--muted); font-size:14px; margin-top:8px;}
    .section-title{margin:0 0 10px; font-size:18px;}
    .bar-row{margin-bottom:10px;}
    .bar-head{display:flex; justify-content:space-between; font-size:14px; margin-bottom:4px;}
    .bar-wrap{height:12px; background:#eef2f7; border-radius:999px; overflow:hidden;}
    .bar-fill{height:100%; background:#111827; border-radius:999px;}
    .small{font-size:13px; color:var(--muted);}
    @media (max-width:700px){
      .tabs{grid-template-columns:repeat(2,1fr);}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="topbar">
        <div>
          <h1>새벽의 러닝 이야기</h1>
          <p class="sub">기록을 넘어, 달린 시간의 이야기</p>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="secondary" onclick="downloadCSV()">CSV 다운로드</button>
          <button class="secondary" onclick="downloadBackup()">백업 저장</button>
          <button class="secondary" onclick="restoreAutoBackup()">자동백업 복원</button>
          <button class="secondary" onclick="document.getElementById('csvImport').click()">CSV 가져오기</button>
          <input id="csvImport" type="file" accept=".csv" class="hidden" />
        </div>
      </div>
    </div>

    <div class="card">
      <div id="todayStatus"></div>
      <div class="helper" id="backupInfo"></div>
    </div>

    <div class="stats" id="statCards"></div>

    <div class="tabs">
      <button class="tab active" data-tab="today">오늘 기록</button>
      <button class="tab" data-tab="race">대회기록</button>
      <button class="tab" data-tab="logs">기록보기</button>
      <button class="tab" data-tab="stats">통계</button>
    </div>

    <div id="today" class="tab-panel">
      <div class="card">
        <h2 class="section-title">훈련기록 입력</h2>
        <div class="grid cols-4">
          <div><label>날짜</label><input type="date" id="date"></div>
          <div><label>체중 (kg)</label><input id="weight" placeholder="69.8"></div>
          <div><label>수면시간</label><input id="sleepHours" placeholder="6.5"></div>
          <div><label>훈련종류</label><select id="trainingType"></select></div>
        </div>
        <div class="grid cols-4" style="margin-top:12px;">
          <div><label>러닝화</label><input id="shoe" placeholder="알파플라이 3"></div>
          <div><label>장소</label><select id="location"></select></div>
          <div id="customLocationWrap" class="hidden"><label>직접 입력 장소</label><input id="customLocation"></div>
          <div><label>거리 (km)</label><input id="distance" placeholder="10"></div>
          <div><label>시간 (mm:ss 또는 hh:mm:ss)</label><input id="duration" placeholder="56:20"></div>
          <div><label>페이스</label><input id="pace" placeholder="자동 계산 또는 직접 입력"></div>
        </div>
        <div class="grid cols-2" style="margin-top:12px;">
          <div><label>근력운동</label><textarea id="strength" placeholder="스쿼트 3×15"></textarea></div>
          <div class="grid cols-2">
            <div><label>컨디션</label><select id="condition"></select></div>
            <div><label>통증 / 불편 부위</label><input id="pain" placeholder="왼쪽 종아리"></div>
            <div style="grid-column:1 / -1;"><label>메모</label><textarea id="memo" placeholder="그날의 느낌"></textarea></div>
          </div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;">
          <button onclick="saveTraining()">훈련 저장</button>
          <button class="secondary" onclick="resetTrainingForm()">새로 입력</button>
        </div>
      </div>
    </div>

    <div id="race" class="tab-panel hidden">
      <div class="card">
        <h2 class="section-title">대회기록 입력</h2>
        <div class="grid cols-4">
          <div><label>날짜</label><input type="date" id="raceDate"></div>
          <div><label>대회명</label><input id="raceName" placeholder="서울국제마라톤"></div>
          <div><label>종목</label><select id="raceType"></select></div>
          <div><label>러닝화</label><input id="raceShoe" placeholder="알파플라이 3"></div>
        </div>
        <div class="grid cols-4" style="margin-top:12px;">
          <div><label>거리 (km)</label><input id="raceDistance" placeholder="42.195"></div>
          <div><label>기록 (hh:mm:ss)</label><input id="raceDuration" placeholder="3:09:27"></div>
          <div><label>페이스</label><input id="racePace" placeholder="자동 계산 또는 직접 입력"></div>
          <div><label>체중 (kg)</label><input id="raceWeight" placeholder="69.0"></div>
        </div>
        <div class="grid cols-2" style="margin-top:12px;">
          <div><label>PB 표시</label><select id="racePB"><option value="아니오">아니오</option><option value="예">예</option></select></div>
          <div><label>메모</label><textarea id="raceMemo" placeholder="그날의 이야기"></textarea></div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;">
          <button onclick="saveRace()">대회 저장</button>
          <button class="secondary" onclick="resetRaceForm()">새로 입력</button>
        </div>
      </div>
    </div>

    <div id="logs" class="tab-panel hidden">
      <div class="card">
        <label>검색</label>
        <input id="query" placeholder="날짜, 장소, 대회명, 메모 검색">
      </div>
      <div class="card">
        <h2 class="section-title">훈련기록</h2>
        <div id="trainingList"></div>
      </div>
      <div class="card">
        <h2 class="section-title">대회기록</h2>
        <div id="raceList"></div>
      </div>
    </div>

    <div id="stats" class="tab-panel hidden">
      <div class="card" id="statsText"></div>
      <div class="grid cols-2">
        <div class="card">
          <h2 class="section-title">월별 거리 그래프</h2>
          <div id="monthlyList"></div>
        </div>
        <div class="card">
          <h2 class="section-title">연도별 거리 그래프</h2>
          <div id="yearlyList"></div>
        </div>
      </div>
      <div class="card">
        <h2 class="section-title">PB 기록</h2>
        <div id="pbList"></div>
      </div>
    </div>
  </div>

  <script>
    const TRAINING_KEY = "saebyeok-story-training-v15";
    const RACE_KEY = "saebyeok-story-race-v15";
    const AUTO_KEY = "saebyeok-story-autobackup-v15";

    const TRAINING_TYPES = ["화달","목달","토훈","일달","개인훈련","풀코스","하프","근력","휴식"];
    const CONDITION_TYPES = ["좋음","보통","나쁨"];
    const LOCATIONS = ["중랑천","망우언덕","초안산","무수골","남산","과기대 트랙","의정부종합운동장","헬스장","대회","기타"];
    const DISTANCE_PRESETS = {"풀코스":"42.195","하프":"21.0975"};
    const RACE_TYPES = ["풀코스","하프","10K","5K","기타"];
    const RACE_DISTANCE_PRESETS = {"풀코스":"42.195","하프":"21.0975","10K":"10","5K":"5"};

    function todayStr(){
      const d=new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }
    function nowText(){
      const d=new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    }
    function el(id){ return document.getElementById(id); }
    function monthKey(d){ return String(d).slice(0,7); }
    function yearKey(d){ return String(d).slice(0,4); }
    function escapeHtml(s){ return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function nl2br(s){ return String(s).replace(/\n/g,"<br>"); }

    function parseSeconds(text){
      const parts = String(text || "").split(":").map(Number);
      if(parts.some(Number.isNaN)) return 0;
      if(parts.length === 2) return parts[0]*60 + parts[1];
      if(parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
      return 0;
    }
    function formatPaceFromDuration(distance, duration){
      const d = parseFloat(distance);
      if(!d || !duration) return "";
      const total = parseSeconds(duration);
      if(!total) return "";
      const secPerKm = total / d;
      return `${Math.floor(secPerKm/60)}:${String(Math.round(secPerKm%60)).padStart(2,"0")}/km`;
    }

    function getTrainings(){ try { return JSON.parse(localStorage.getItem(TRAINING_KEY) || "[]"); } catch(e){ return []; } }
    function getRaces(){ try { return JSON.parse(localStorage.getItem(RACE_KEY) || "[]"); } catch(e){ return []; } }

    function saveAutoBackup(){
      const payload = { savedAt: nowText(), trainings: getTrainings(), races: getRaces() };
      localStorage.setItem(AUTO_KEY, JSON.stringify(payload));
      renderBackupInfo();
    }
    function setTrainings(v){
      localStorage.setItem(TRAINING_KEY, JSON.stringify(v));
      saveAutoBackup();
    }
    function setRaces(v){
      localStorage.setItem(RACE_KEY, JSON.stringify(v));
      saveAutoBackup();
    }

    function downloadBackup(){
      const payload = { savedAt: nowText(), trainings: getTrainings(), races: getRaces() };
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `saebyeok-story-backup-${todayStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function restoreAutoBackup(){
      try{
        const b = JSON.parse(localStorage.getItem(AUTO_KEY) || "");
        if(!b || !Array.isArray(b.trainings) || !Array.isArray(b.races)){
          alert("자동백업이 없습니다.");
          return;
        }
        localStorage.setItem(TRAINING_KEY, JSON.stringify(b.trainings));
        localStorage.setItem(RACE_KEY, JSON.stringify(b.races));
        renderAll();
        alert("자동백업을 복원했습니다.");
      }catch(e){
        alert("자동백업이 없습니다.");
      }
    }

    function renderBackupInfo(){
      try{
        const b = JSON.parse(localStorage.getItem(AUTO_KEY) || "");
        el("backupInfo").textContent = b?.savedAt ? `최근 자동백업: ${b.savedAt}` : "최근 자동백업이 아직 없습니다.";
      }catch(e){
        el("backupInfo").textContent = "최근 자동백업이 아직 없습니다.";
      }
    }

    function fillOptions(){
      TRAINING_TYPES.forEach(v=>{ const o=document.createElement("option"); o.value=v; o.textContent=v; el("trainingType").appendChild(o); });
      CONDITION_TYPES.forEach(v=>{ const o=document.createElement("option"); o.value=v; o.textContent=v; el("condition").appendChild(o); });
      LOCATIONS.forEach(v=>{ const o=document.createElement("option"); o.value=v; o.textContent=v; el("location").appendChild(o); });
      RACE_TYPES.forEach(v=>{ const o=document.createElement("option"); o.value=v; o.textContent=v; el("raceType").appendChild(o); });
    }

    function toggleCustomLocation(){
      el("customLocationWrap").classList.toggle("hidden", el("location").value !== "기타");
    }

    function applyTrainingPreset(){
      const t = el("trainingType").value;
      if(DISTANCE_PRESETS[t]){
        el("distance").value = DISTANCE_PRESETS[t];
        el("distance").disabled = true;
      }else{
        el("distance").disabled = false;
      }
    }

    function applyRacePreset(){
      const t = el("raceType").value;
      if(RACE_DISTANCE_PRESETS[t]){
        el("raceDistance").value = RACE_DISTANCE_PRESETS[t];
        el("raceDistance").disabled = (t !== "기타");
      }else{
        el("raceDistance").disabled = false;
      }
    }

    function resetTrainingForm(){
      el("date").value = todayStr();
      el("weight").value = "";
      el("sleepHours").value = "";
      el("trainingType").value = "개인훈련";
      el("shoe").value = "";
      el("location").value = "중랑천";
      el("customLocation").value = "";
      el("distance").value = "";
      el("duration").value = "";
      el("pace").value = "";
      el("strength").value = "";
      el("condition").value = "보통";
      el("pain").value = "";
      el("memo").value = "";
      toggleCustomLocation();
      applyTrainingPreset();
    }

    function resetRaceForm(){
      el("raceDate").value = todayStr();
      el("raceName").value = "";
      el("raceType").value = "풀코스";
      el("raceShoe").value = "";
      el("raceDistance").value = "42.195";
      el("raceDuration").value = "";
      el("racePace").value = "";
      el("raceWeight").value = "";
      el("racePB").value = "아니오";
      el("raceMemo").value = "";
      applyRacePreset();
    }

    function saveTraining(){
      const location = el("location").value === "기타" ? el("customLocation").value : el("location").value;
      const item = {
        id: String(Date.now()) + Math.random().toString(36).slice(2,7),
        date: el("date").value,
        weight: el("weight").value,
        sleepHours: el("sleepHours").value,
        trainingType: el("trainingType").value,
        shoe: el("shoe").value,
        location,
        distance: el("distance").value,
        duration: el("duration").value,
        pace: el("pace").value,
        strength: el("strength").value,
        condition: el("condition").value,
        pain: el("pain").value,
        memo: el("memo").value
      };
      if(!item.date){ alert("날짜를 입력해 주세요."); return; }
      const arr = getTrainings();
      arr.unshift(item);
      setTrainings(arr);
      resetTrainingForm();
      renderAll();
      activateTab("logs");
    }

    function saveRace(){
      const item = {
        id: String(Date.now()) + Math.random().toString(36).slice(2,7),
        date: el("raceDate").value,
        raceName: el("raceName").value,
        raceType: el("raceType").value,
        shoe: el("raceShoe").value,
        distance: el("raceDistance").value,
        duration: el("raceDuration").value,
        pace: el("racePace").value,
        weight: el("raceWeight").value,
        isPB: el("racePB").value,
        memo: el("raceMemo").value
      };
      if(!item.date || !item.raceName){ alert("날짜와 대회명을 입력해 주세요."); return; }
      const arr = getRaces();
      arr.unshift(item);
      setRaces(arr);
      resetRaceForm();
      renderAll();
      activateTab("logs");
    }

    function computeTodayStatus(){
      const today = todayStr();
      const trainings = getTrainings().filter(v=>v.date===today);
      const races = getRaces().filter(v=>v.date===today);
      let hasRun = false, hasStrength = false;

      trainings.forEach(v=>{
        if(parseFloat(v.distance) > 0 || ["풀코스","하프"].includes(v.trainingType)) hasRun = true;
        if((v.strength || "").trim() || v.trainingType === "근력") hasStrength = true;
      });
      races.forEach(v=>{
        if(parseFloat(v.distance) > 0) hasRun = true;
      });

      if(hasRun && hasStrength) return "운동 · 러닝 + 근력";
      if(hasRun) return "운동 · 러닝";
      if(hasStrength) return "운동 · 근력";
      return "휴식";
    }

    function renderTodayStatus(){
      const status = computeTodayStatus();
      const cls = status === "휴식" ? "status-off" : "status-on";
      el("todayStatus").innerHTML = `<span class="status-pill ${cls}">오늘 상태: ${status}</span>`;
    }

    function allDistanceItems(){
      return [
        ...getTrainings().map(v=>({date:v.date, distance:v.distance})),
        ...getRaces().map(v=>({date:v.date, distance:v.distance}))
      ];
    }

    function bestRaceByType(type){
      const list = getRaces().filter(v =>
        String(v.raceType || "") === type &&
        parseFloat(v.distance) > 0 &&
        parseSeconds(v.duration) > 0
      );
      if(!list.length) return null;
      return list.sort((a,b)=>parseSeconds(a.duration)-parseSeconds(b.duration))[0];
    }

    function renderBarList(targetId, rows){
      const max = Math.max(1, ...rows.map(r=>r.value));
      el(targetId).innerHTML = rows.length
        ? rows.map(r => `
            <div class="bar-row">
              <div class="bar-head"><span>${r.label}</span><span>${r.text}</span></div>
              <div class="bar-wrap"><div class="bar-fill" style="width:${Math.max(6,(r.value/max)*100)}%"></div></div>
            </div>
          `).join("")
        : "<p class='small'>아직 기록이 없습니다.</p>";
    }

    function renderStats(){
      const trainings = getTrainings();
      const races = getRaces();
      const all = allDistanceItems().filter(v=>parseFloat(v.distance) > 0);

      const now = todayStr();
      const currentMonth = monthKey(now);
      const currentYear = yearKey(now);

      const total = all.reduce((s,v)=>s+(parseFloat(v.distance)||0),0);
      const month = all.filter(v=>monthKey(v.date)===currentMonth).reduce((s,v)=>s+(parseFloat(v.distance)||0),0);
      const year = all.filter(v=>yearKey(v.date)===currentYear).reduce((s,v)=>s+(parseFloat(v.distance)||0),0);
      const jung = trainings.filter(v=>(v.location||"").includes("중랑천")).reduce((s,v)=>s+(parseFloat(v.distance)||0),0);

      el("statCards").innerHTML = [
        ["이번 달 거리", `${month.toFixed(1)} km`],
        ["올해 거리", `${year.toFixed(1)} km`],
        ["총 누적 거리", `${total.toFixed(1)} km`],
        ["중랑천 누적", `${jung.toFixed(1)} km`],
        ["대회 기록 수", `${races.length} 회`]
      ].map(([a,b])=>`<div class="card stat"><div class="label">${a}</div><div class="value">${b}</div></div>`).join("");

      el("statsText").innerHTML = `
        <p><strong>이번 달 거리</strong>: ${month.toFixed(1)} km</p>
        <p><strong>올해 거리</strong>: ${year.toFixed(1)} km</p>
        <p><strong>총 누적 거리</strong>: ${total.toFixed(1)} km</p>
        <p><strong>중랑천 누적 거리</strong>: ${jung.toFixed(1)} km</p>
        <p><strong>대회 기록 수</strong>: ${races.length} 회</p>
      `;

      const monthly = {};
      const yearly = {};
      all.forEach(v=>{
        const mk = monthKey(v.date);
        const yk = yearKey(v.date);
        monthly[mk] = (monthly[mk] || 0) + (parseFloat(v.distance)||0);
        yearly[yk] = (yearly[yk] || 0) + (parseFloat(v.distance)||0);
      });

      const monthlyRows = Object.entries(monthly)
        .sort((a,b)=>a[0]>b[0]?1:-1)
        .slice(-12)
        .map(([k,v])=>({label:k, value:v, text:`${v.toFixed(1)} km`}));

      const yearlyRows = Object.entries(yearly)
        .sort((a,b)=>a[0]>b[0]?1:-1)
        .map(([k,v])=>({label:k, value:v, text:`${v.toFixed(1)} km`}));

      renderBarList("monthlyList", monthlyRows);
      renderBarList("yearlyList", yearlyRows);

      const pb = [];
      ["풀코스","하프","10K","5K"].forEach(type=>{
        const best = bestRaceByType(type);
        if(best){
          pb.push(`<p><strong>${type}</strong>: ${escapeHtml(best.duration)} · ${escapeHtml(best.raceName || "")} · ${escapeHtml(best.date)}</p>`);
        }
      });
      el("pbList").innerHTML = pb.length ? pb.join("") : "<p>PB 기록이 아직 없습니다.</p>";
    }

    function renderLists(){
      const q = (el("query").value || "").trim().toLowerCase();

      const trainings = getTrainings()
        .slice()
        .sort((a,b)=>a.date<b.date?1:-1)
        .filter(v=>[v.date,v.location,v.trainingType,v.memo,v.pain,v.shoe].join(" ").toLowerCase().includes(q));

      const races = getRaces()
        .slice()
        .sort((a,b)=>a.date<b.date?1:-1)
        .filter(v=>[v.date,v.raceName,v.raceType,v.memo,v.shoe].join(" ").toLowerCase().includes(q));

      el("trainingList").innerHTML = trainings.length
        ? trainings.map(v=>`
            <div class="entry">
              <div class="entry-title">${escapeHtml(v.date)}</div>
              <div class="badges">
                <span class="badge">${escapeHtml(v.trainingType)}</span>
                <span class="badge">${escapeHtml(v.location || "")}</span>
              </div>
              <div class="meta">
                ${v.distance ? `<span>거리 ${escapeHtml(v.distance)}km</span>` : ""}
                ${v.duration ? `<span>시간 ${escapeHtml(v.duration)}</span>` : ""}
                ${v.pace ? `<span>페이스 ${escapeHtml(v.pace)}</span>` : ""}
              </div>
              ${v.memo ? `<p>${nl2br(escapeHtml(v.memo))}</p>` : ""}
            </div>
          `).join("")
        : "<p>훈련기록이 아직 없습니다.</p>";

      el("raceList").innerHTML = races.length
        ? races.map(v=>`
            <div class="entry">
              <div class="entry-title">${escapeHtml(v.date)} · ${escapeHtml(v.raceName)}</div>
              <div class="badges">
                <span class="badge">${escapeHtml(v.raceType)}</span>
                ${v.isPB === "예" ? `<span class="badge">PB</span>` : ""}
              </div>
              <div class="meta">
                ${v.distance ? `<span>거리 ${escapeHtml(v.distance)}km</span>` : ""}
                ${v.duration ? `<span>기록 ${escapeHtml(v.duration)}</span>` : ""}
                ${v.pace ? `<span>페이스 ${escapeHtml(v.pace)}</span>` : ""}
              </div>
              ${v.memo ? `<p>${nl2br(escapeHtml(v.memo))}</p>` : ""}
            </div>
          `).join("")
        : "<p>대회기록이 아직 없습니다.</p>";
    }

    function activateTab(name){
      document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.tab===name));
      document.querySelectorAll(".tab-panel").forEach(p=>p.classList.toggle("hidden", p.id!==name));
    }

    function downloadCSV(){
      const trainings = getTrainings().map(v=>["훈련",v.date,v.trainingType,v.location||"",v.distance||"",v.duration||"",v.pace||"",v.shoe||"",v.weight||"",v.sleepHours||"",v.memo||"",v.strength||""]);
      const races = getRaces().map(v=>["대회",v.date,v.raceType,v.raceName||"",v.distance||"",v.duration||"",v.pace||"",v.shoe||"",v.weight||"",v.isPB||"",v.memo||"",""]);
      const rows = [["구분","날짜","종류","장소/대회명","거리","시간/기록","페이스","러닝화","체중","추가정보","메모","근력운동"], ...trainings, ...races];
      const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
      const blob = new Blob(["\ufeff"+csv], {type:"text/csv;charset=utf-8;"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `saebyeok-story-${todayStr()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function parseCsvLine(line){
      const result = [];
      let current = "", inQuotes = false;
      for(let i=0;i<line.length;i++){
        const ch = line[i], next = line[i+1];
        if(ch === '"' && inQuotes && next === '"'){ current += '"'; i++; }
        else if(ch === '"'){ inQuotes = !inQuotes; }
        else if(ch === "," && !inQuotes){ result.push(current); current = ""; }
        else current += ch;
      }
      result.push(current);
      return result;
    }

    function dedupeRaces(arr){
      const unique = [];
      const seen = new Set();
      arr.forEach(r=>{
        const key = `${r.date}-${r.raceName}-${r.duration}`;
        if(!seen.has(key)){
          seen.add(key);
          unique.push(r);
        }
      });
      return unique;
    }

    function importCSVText(text){
      const lines = text.trim().split(/\r?\n/);
      if(lines.length < 2){
        alert("CSV 내용이 없습니다.");
        return;
      }

      const rows = lines.map(parseCsvLine);
      const header = rows.shift();

      const trainings = [];
      const races = [];

      const hasTypeColumn = header[0] === "구분";

      rows.forEach(r => {
        if(hasTypeColumn){
          if((r[0] || "") === "훈련"){
            trainings.push({
              id: String(Date.now()) + Math.random().toString(36).slice(2,8),
              date: r[1] || "",
              trainingType: r[2] || "개인훈련",
              location: r[3] || "",
              distance: r[4] || "",
              duration: r[5] || "",
              pace: r[6] || "",
              shoe: r[7] || "",
              weight: r[8] || "",
              sleepHours: r[9] || "",
              memo: r[10] || "",
              strength: r[11] || "",
              condition: "보통",
              pain: ""
            });
          } else if((r[0] || "") === "대회"){
            races.push({
              id: String(Date.now()) + Math.random().toString(36).slice(2,8),
              date: r[1] || "",
              raceType: r[2] || "풀코스",
              raceName: r[3] || "",
              distance: r[4] || "",
              duration: r[5] || "",
              pace: r[6] || "",
              shoe: r[7] || "",
              weight: r[8] || "",
              isPB: r[9] || "아니오",
              memo: r[10] || ""
            });
          }
        } else {
          const place = r[3] || "";
          const subtype = r[4] || "개인훈련";
          const distance = r[5] || "";
          const duration = r[6] || "";
          const memo = r[12] || "";

          if(place === "대회" || subtype === "풀코스" || subtype === "하프" || subtype === "10K" || subtype === "5K"){
            const titleFromMemo = memo.includes("/") ? memo.split("/")[0].trim() : "대회기록";
            races.push({
              id: String(Date.now()) + Math.random().toString(36).slice(2,8),
              date: r[0] || "",
              raceType: subtype || "풀코스",
              raceName: titleFromMemo,
              distance: distance,
              duration: duration,
              pace: r[7] || "",
              shoe: r[11] || "",
              weight: r[1] || "",
              isPB: memo.includes("PB") ? "예" : "아니오",
              memo: memo
            });
          } else {
            trainings.push({
              id: String(Date.now()) + Math.random().toString(36).slice(2,8),
              date: r[0] || "",
              weight: r[1] || "",
              sleepHours: r[2] || "",
              location: r[3] || "",
              trainingType: subtype,
              distance: distance,
              duration: duration,
              pace: r[7] || "",
              strength: r[8] || "",
              condition: r[9] || "보통",
              pain: r[10] || "",
              shoe: r[11] || "",
              memo: memo
            });
          }
        }
      });

      if(trainings.length){
        setTrainings([...trainings, ...getTrainings()]);
      }

      if(races.length){
        const existing = getRaces();
        const merged = dedupeRaces([...races, ...existing]);
        setRaces(merged);
      } else {
        // 가져온 파일에 대회가 없어도 기존 중복 정리
        setRaces(dedupeRaces(getRaces()));
      }

      renderAll();
      alert(`가져오기 완료: 훈련 ${trainings.length}개, 대회 ${races.length}개`);
    }

    function renderAll(){
      renderTodayStatus();
      renderStats();
      renderLists();
      renderBackupInfo();
    }

    document.addEventListener("DOMContentLoaded", ()=>{
      fillOptions();
      resetTrainingForm();
      resetRaceForm();
      renderAll();

      document.querySelectorAll(".tab").forEach(btn=>{
        btn.addEventListener("click", ()=>activateTab(btn.dataset.tab));
      });

      el("location").addEventListener("change", toggleCustomLocation);
      el("trainingType").addEventListener("change", applyTrainingPreset);
      el("raceType").addEventListener("change", applyRacePreset);
      el("distance").addEventListener("input", ()=>{ const p=formatPaceFromDuration(el("distance").value, el("duration").value); if(p) el("pace").value=p; });
      el("duration").addEventListener("input", ()=>{ const p=formatPaceFromDuration(el("distance").value, el("duration").value); if(p) el("pace").value=p; });
      el("raceDistance").addEventListener("input", ()=>{ const p=formatPaceFromDuration(el("raceDistance").value, el("raceDuration").value); if(p) el("racePace").value=p; });
      el("raceDuration").addEventListener("input", ()=>{ const p=formatPaceFromDuration(el("raceDistance").value, el("raceDuration").value); if(p) el("racePace").value=p; });
      el("query").addEventListener("input", renderLists);

      el("csvImport").addEventListener("change", e=>{
        const f = e.target.files[0];
        if(!f) return;
        f.text().then(importCSVText);
        e.target.value = "";
      });

      saveAutoBackup();
    });
  </script>
</body>
