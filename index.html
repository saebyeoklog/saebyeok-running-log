<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>새벽의 달리기 이야기</title>

<style>
body {font-family: sans-serif; margin:0; background:#f5f7fb;}
.wrap{max-width:900px;margin:auto;padding:15px;}
.card{background:white;border-radius:12px;padding:15px;margin-bottom:15px;}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.stat{background:#111;color:white;padding:10px;border-radius:10px;text-align:center;}
.stat .value{font-size:20px;font-weight:bold;}

.pb{background:#ffe8e8;padding:10px;border-radius:10px;margin-top:10px;}

.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px;}
.day{background:white;padding:8px;border-radius:8px;text-align:center;font-size:12px;}
.run{background:#dbeafe;font-weight:bold;}

.tab{display:flex;gap:5px;margin-bottom:10px;}
.tab button{flex:1;padding:10px;border:none;border-radius:8px;}
.active{background:#111;color:white;}
</style>

</head>

<body>
<div class="wrap">

<div class="card stats" id="stats"></div>

<div class="card pb" id="pb"></div>

<div class="card">
<h3>이달 달린 거리</h3>
<div id="calendar" class="calendar"></div>
</div>

</div>

<script>

const TRAINING_KEY="run_train_v18";
const RACE_KEY="run_race_v18";

function getTrain(){return JSON.parse(localStorage.getItem(TRAINING_KEY)||"[]")}
function getRace(){return JSON.parse(localStorage.getItem(RACE_KEY)||"[]")}

function stats(){
 let t=getTrain(), r=getRace();
 let all=[...t,...r];

 let month=new Date().toISOString().slice(0,7);

 let m=0,y=0,total=0;

 all.forEach(v=>{
   let d=parseFloat(v.distance)||0;
   total+=d;
   if(v.date?.startsWith(month)) m+=d;
   if(v.date?.startsWith(month.slice(0,4))) y+=d;
 });

 document.getElementById("stats").innerHTML=`
 <div class="stat"><div>이번달</div><div class="value">${m.toFixed(1)}</div></div>
 <div class="stat"><div>연간</div><div class="value">${y.toFixed(1)}</div></div>
 <div class="stat"><div>누적</div><div class="value">${total.toFixed(1)}</div></div>
 <div class="stat"><div>대회수</div><div class="value">${r.length}</div></div>
 `;
}

function pb(){
 let r=getRace();
 if(!r.length) return;
 let best=r.sort((a,b)=>a.duration.localeCompare(b.duration))[0];
 document.getElementById("pb").innerHTML=`PB: ${best.duration} (${best.date})`;
}

function calendar(){
 let t=getTrain();
 let now=new Date();
 let month=now.toISOString().slice(0,7);

 let days=new Date(now.getFullYear(), now.getMonth()+1,0).getDate();

 let map={};
 t.forEach(v=>{
   if(v.date?.startsWith(month)){
     let d=v.date.split("-")[2];
     map[d]=v.distance;
   }
 });

 let html="";
 for(let i=1;i<=days;i++){
   let d=String(i).padStart(2,"0");
   let dist=map[d]||"";
   html+=`<div class="day ${dist?"run":""}">${i}<br>${dist}</div>`;
 }

 document.getElementById("calendar").innerHTML=html;
}

stats();
pb();
calendar();

</script>

</body>
</html>
