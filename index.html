<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAEBYEOK RUN LOG 1.1</title>
  <style>
    :root { --bg:#f6f7fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb; --accent:#111827; --danger:#b91c1c; }
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:1100px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
    .topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap} h1{margin:0 0 8px;font-size:28px}.sub{color:var(--muted);margin:0}
    button{border:0;border-radius:12px;padding:10px 14px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
    button.secondary{background:#fff;color:var(--text);border:1px solid var(--line)} button.danger{background:#fff;color:var(--danger);border:1px solid #fecaca}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:26px;font-weight:700;margin-top:6px}
    .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.tab{background:#fff;border:1px solid var(--line);color:var(--text)} .tab.active{background:var(--accent);color:#fff}
    .hidden{display:none}.grid{display:grid;gap:12px}.grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.grid.cols-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px} input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:14px;background:#fff}
    textarea{min-height:110px;resize:vertical}.entry{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;background:#fff}.entry-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:start}
    .badges{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.badge{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:#374151;background:#f9fafb}
    .meta{display:flex;flex-wrap:wrap;gap:10px 14px;color:var(--muted);font-size:14px;margin-top:8px}.section-title{margin:0 0 10px;font-size:18px}.footer-note{color:var(--muted);font-size:13px;margin-top:8px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="topbar">
      <div><h1>새벽 러닝로그 1.1</h1><p class="sub">SAEBYEOK RUN LOG · 훈련기록과 대회기록을 분리하고, 통계는 합산하는 버전</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="secondary" onclick="downloadCSV()">CSV 다운로드</button>
        <button class="secondary" onclick="document.getElementById('csvImport').click()">CSV 가져오기</button>
        <input id="csvImport" type="file" accept=".csv" class="hidden" />
      </div>
    </div>
  </div>
  <div class="stats" id="statCards"></div>
  <div class="tabs">
    <button class="tab active" data-tab="today">훈련기록</button>
    <button class="tab" data-tab="race">대회기록</button>
    <button class="tab" data-tab="logs">기록 보기</button>
    <button class="tab" data-tab="stats">통계</button>
  </div>

  <div id="today" class="tab-panel">
    <div class="card">
      <h2 class="section-title" id="trainingFormTitle">훈련기록 입력</h2>
      <div class="grid cols-4">
        <div><label>날짜</label><input type="date" id="date"></div>
        <div><label>체중 (kg)</label><input id="weight" placeholder="69.8"></div>
        <div><label>수면시간 (시간)</label><input id="sleepHours" placeholder="6.5"></div>
        <div><label>훈련종류</label><select id="trainingType"></select></div>
      </div>
      <div class="grid cols-4" style="margin-top:12px;">
        <div><label>러닝화</label><input id="shoe" placeholder="예: 알파플라이 3"></div>
        <div><label>훈련장소</label><select id="location"></select></div>
        <div id="customLocationWrap" class="hidden"><label>직접 입력 장소</label><input id="customLocation"></div>
        <div><label>거리 (km)</label><input id="distance" placeholder="10"></div>
        <div><label>시간 (mm:ss 또는 hh:mm:ss)</label><input id="duration" placeholder="56:20"></div>
        <div><label>페이스</label><input id="pace" placeholder="자동 계산 또는 직접 입력"></div>
      </div>
      <div class="grid cols-2" style="margin-top:12px;">
        <div><label>근력운동</label><textarea id="strength" placeholder="스쿼트 3×15&#10;플랭크 3×1분"></textarea></div>
        <div class="grid cols-2">
          <div><label>컨디션</label><select id="condition"></select></div>
          <div><label>통증 / 불편 부위</label><input id="pain" placeholder="왼쪽 종아리 약간 뻐근"></div>
          <div style="grid-column:1 / -1;"><label>메모</label><textarea id="memo" placeholder="해피러닝 후배들과 조깅&#10;초반 몸이 무거웠지만 후반 좋아짐"></textarea></div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
        <button onclick="saveTraining()">훈련 저장</button>
        <button class="secondary" onclick="resetTrainingForm()">새로 입력</button>
      </div>
    </div>
  </div>

  <div id="race" class="tab-panel hidden">
    <div class="card">
      <h2 class="section-title" id="raceFormTitle">대회기록 입력</h2>
      <div class="grid cols-4">
        <div><label>날짜</label><input type="date" id="raceDate"></div>
        <div><label>대회명</label><input id="raceName" placeholder="예: 서울국제마라톤"></div>
        <div><label>종목</label><select id="raceType"></select></div>
        <div><label>러닝화</label><input id="raceShoe" placeholder="예: 알파플라이 3"></div>
      </div>
      <div class="grid cols-4" style="margin-top:12px;">
        <div><label>거리 (km)</label><input id="raceDistance" placeholder="42.195"></div>
        <div><label>기록 (hh:mm:ss)</label><input id="raceDuration" placeholder="3:09:27"></div>
        <div><label>페이스</label><input id="racePace" placeholder="자동 계산 또는 직접 입력"></div>
        <div><label>체중 (kg)</label><input id="raceWeight" placeholder="69.0"></div>
      </div>
      <div class="grid cols-2" style="margin-top:12px;">
        <div><label>PB 표시</label><select id="racePB"><option value="아니오">아니오</option><option value="예">예</option></select></div>
        <div><label>메모</label><textarea id="raceMemo" placeholder="해피열차 씽글칸 좌석표 획득"></textarea></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
        <button onclick="saveRace()">대회 저장</button>
        <button class="secondary" onclick="resetRaceForm()">새로 입력</button>
      </div>
    </div>
  </div>

  <div id="logs" class="tab-panel hidden">
    <div class="card"><label>검색</label><input id="query" placeholder="날짜, 장소, 대회명, 훈련종류, 메모 검색"></div>
    <div class="card"><h2 class="section-title">훈련기록</h2><div id="trainingList"></div></div>
    <div class="card"><h2 class="section-title">대회기록</h2><div id="raceList"></div></div>
  </div>

  <div id="stats" class="tab-panel hidden">
    <div class="card" id="statsText"></div>
    <div class="card"><h2 class="section-title">월별 거리 (훈련 + 대회 합산)</h2><div id="monthlyList"></div></div>
    <div class="card"><h2 class="section-title">PB 기록</h2><div id="pbList"></div></div>
  </div>
</div>

<script>
const TRAINING_KEY="saebyeok-training-v11", RACE_KEY="saebyeok-race-v11";
const TRAINING_TYPES=["화달","목달","토훈","일달","개인훈련","풀코스","하프","근력","휴식"];
const CONDITION_TYPES=["좋음","보통","나쁨"];
const LOCATIONS=["중랑천","망우언덕","초안산","무수골","남산","과기대 트랙","의정부종합운동장","헬스장","기타"];
const DISTANCE_PRESETS={"풀코스":"42.195","하프":"21.0975"};
const RACE_TYPES=["풀코스","하프","10K","기타"], RACE_DISTANCE_PRESETS={"풀코스":"42.195","하프":"21.0975","10K":"10"};
let editingTrainingId="", editingRaceId="";
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function el(id){return document.getElementById(id)} function monthKey(d){return d.slice(0,7)} function yearKey(d){return d.slice(0,4)}
function formatPaceFromDuration(distance,duration){const dd=parseFloat(distance); if(!dd||!duration)return ""; const p=duration.split(":").map(Number); if(p.some(Number.isNaN)) return ""; let t=0; if(p.length===2)t=p[0]*60+p[1]; else if(p.length===3)t=p[0]*3600+p[1]*60+p[2]; else return ""; const sec=t/dd; return `${Math.floor(sec/60)}:${String(Math.round(sec%60)).padStart(2,"0")}/km`;}
function getTrainings(){try{return JSON.parse(localStorage.getItem(TRAINING_KEY)||"[]")}catch(e){return []}} function setTrainings(v){localStorage.setItem(TRAINING_KEY,JSON.stringify(v))}
function getRaces(){try{return JSON.parse(localStorage.getItem(RACE_KEY)||"[]")}catch(e){return []}} function setRaces(v){localStorage.setItem(RACE_KEY,JSON.stringify(v))}
function fillOptions(){TRAINING_TYPES.forEach(v=>{let o=document.createElement("option");o.value=v;o.textContent=v;el("trainingType").appendChild(o)}); CONDITION_TYPES.forEach(v=>{let o=document.createElement("option");o.value=v;o.textContent=v;el("condition").appendChild(o)}); LOCATIONS.forEach(v=>{let o=document.createElement("option");o.value=v;o.textContent=v;el("location").appendChild(o)}); RACE_TYPES.forEach(v=>{let o=document.createElement("option");o.value=v;o.textContent=v;el("raceType").appendChild(o)})}
function resetTrainingForm(){editingTrainingId=""; el("trainingFormTitle").textContent="훈련기록 입력"; el("date").value=todayStr(); el("weight").value=""; el("sleepHours").value=""; el("trainingType").value="개인훈련"; el("shoe").value=""; el("location").value="중랑천"; el("customLocation").value=""; el("distance").value=""; el("duration").value=""; el("pace").value=""; el("strength").value=""; el("condition").value="보통"; el("pain").value=""; el("memo").value=""; toggleCustomLocation(); applyTrainingPreset()}
function resetRaceForm(){editingRaceId=""; el("raceFormTitle").textContent="대회기록 입력"; el("raceDate").value=todayStr(); el("raceName").value=""; el("raceType").value="풀코스"; el("raceShoe").value=""; el("raceDistance").value="42.195"; el("raceDuration").value=""; el("racePace").value=""; el("raceWeight").value=""; el("racePB").value="아니오"; el("raceMemo").value=""; applyRacePreset()}
function toggleCustomLocation(){el("customLocationWrap").classList.toggle("hidden",el("location").value!=="기타")}
function applyTrainingPreset(){const t=el("trainingType").value; if(DISTANCE_PRESETS[t]){el("distance").value=DISTANCE_PRESETS[t]; el("distance").disabled=true}else el("distance").disabled=false}
function applyRacePreset(){const t=el("raceType").value; if(RACE_DISTANCE_PRESETS[t]){el("raceDistance").value=RACE_DISTANCE_PRESETS[t]; el("raceDistance").disabled=(t!=="기타")} else el("raceDistance").disabled=false}
function autoTrainingPace(){const p=formatPaceFromDuration(el("distance").value,el("duration").value); if(p) el("pace").value=p}
function autoRacePace(){const p=formatPaceFromDuration(el("raceDistance").value,el("raceDuration").value); if(p) el("racePace").value=p}
function saveTraining(){const location=el("location").value==="기타"?el("customLocation").value:el("location").value; const item={id:editingTrainingId||String(Date.now()),date:el("date").value,weight:el("weight").value,sleepHours:el("sleepHours").value,trainingType:el("trainingType").value,shoe:el("shoe").value,location,distance:el("distance").value,duration:el("duration").value,pace:el("pace").value,strength:el("strength").value,condition:el("condition").value,pain:el("pain").value,memo:el("memo").value}; if(!item.date||!item.trainingType){alert("날짜와 훈련종류를 입력해 주세요."); return;} const arr=getTrainings(); const idx=arr.findIndex(x=>x.id===item.id); if(idx>=0)arr[idx]=item; else arr.unshift(item); setTrainings(arr); resetTrainingForm(); renderAll(); activateTab("logs")}
function saveRace(){const item={id:editingRaceId||String(Date.now()),date:el("raceDate").value,raceName:el("raceName").value,raceType:el("raceType").value,shoe:el("raceShoe").value,distance:el("raceDistance").value,duration:el("raceDuration").value,pace:el("racePace").value,weight:el("raceWeight").value,isPB:el("racePB").value,memo:el("raceMemo").value}; if(!item.date||!item.raceName){alert("날짜와 대회명을 입력해 주세요."); return;} const arr=getRaces(); const idx=arr.findIndex(x=>x.id===item.id); if(idx>=0)arr[idx]=item; else arr.unshift(item); setRaces(arr); resetRaceForm(); renderAll(); activateTab("logs")}
function editTraining(id){const x=getTrainings().find(v=>v.id===id); if(!x)return; editingTrainingId=id; el("trainingFormTitle").textContent="훈련기록 수정"; el("date").value=x.date||todayStr(); el("weight").value=x.weight||""; el("sleepHours").value=x.sleepHours||""; el("trainingType").value=x.trainingType||"개인훈련"; el("shoe").value=x.shoe||""; if(LOCATIONS.includes(x.location)){el("location").value=x.location; el("customLocation").value=""} else {el("location").value="기타"; el("customLocation").value=x.location||""} el("distance").value=x.distance||""; el("duration").value=x.duration||""; el("pace").value=x.pace||""; el("strength").value=x.strength||""; el("condition").value=x.condition||"보통"; el("pain").value=x.pain||""; el("memo").value=x.memo||""; toggleCustomLocation(); applyTrainingPreset(); activateTab("today")}
function editRace(id){const x=getRaces().find(v=>v.id===id); if(!x)return; editingRaceId=id; el("raceFormTitle").textContent="대회기록 수정"; el("raceDate").value=x.date||todayStr(); el("raceName").value=x.raceName||""; el("raceType").value=x.raceType||"풀코스"; el("raceShoe").value=x.shoe||""; el("raceDistance").value=x.distance||""; el("raceDuration").value=x.duration||""; el("racePace").value=x.pace||""; el("raceWeight").value=x.weight||""; el("racePB").value=x.isPB||"아니오"; el("raceMemo").value=x.memo||""; applyRacePreset(); activateTab("race")}
function deleteTraining(id){if(!confirm("이 훈련기록을 삭제할까요?"))return; setTrainings(getTrainings().filter(v=>v.id!==id)); renderAll()}
function deleteRace(id){if(!confirm("이 대회기록을 삭제할까요?"))return; setRaces(getRaces().filter(v=>v.id!==id)); renderAll()}
function allDistanceItems(){return [...getTrainings().map(v=>({date:v.date,distance:v.distance})), ...getRaces().map(v=>({date:v.date,distance:v.distance}))]}
function renderStats(){const trainings=getTrainings(), races=getRaces(), all=allDistanceItems().filter(v=>parseFloat(v.distance)>0); const now=todayStr(), cm=monthKey(now), cy=yearKey(now); const total=all.reduce((s,v)=>s+(parseFloat(v.distance)||0),0); const month=all.filter(v=>monthKey(v.date)===cm).reduce((s,v)=>s+(parseFloat(v.distance)||0),0); const year=all.filter(v=>yearKey(v.date)===cy).reduce((s,v)=>s+(parseFloat(v.distance)||0),0); const jung=trainings.filter(v=>(v.location||"").includes("중랑천")).reduce((s,v)=>s+(parseFloat(v.distance)||0),0); const raceCount=races.length; const items=[["이번 달 거리",`${month.toFixed(1)} km`],["올해 거리",`${year.toFixed(1)} km`],["총 누적 거리",`${total.toFixed(1)} km`],["중랑천 누적",`${jung.toFixed(1)} km`],["대회 기록 수",`${raceCount} 회`]]; el("statCards").innerHTML=items.map(([a,b])=>`<div class="card stat"><div class="label">${a}</div><div class="value">${b}</div></div>`).join(""); el("statsText").innerHTML=`<p><strong>이번 달 거리</strong>: ${month.toFixed(1)} km</p><p><strong>올해 거리</strong>: ${year.toFixed(1)} km</p><p><strong>총 누적 거리</strong>: ${total.toFixed(1)} km</p><p><strong>중랑천 누적 거리</strong>: ${jung.toFixed(1)} km</p><p><strong>대회 기록 수</strong>: ${raceCount} 회</p>`; const monthly={}; all.forEach(v=>{const k=monthKey(v.date); monthly[k]=(monthly[k]||0)+(parseFloat(v.distance)||0)}); const me=Object.entries(monthly).sort((a,b)=>a[0]>b[0]?1:-1).slice(-12); el("monthlyList").innerHTML=me.length?me.map(([m,d])=>`<p>${m} · ${d.toFixed(1)} km</p>`).join(""):"<p>아직 기록이 없습니다.</p>"; const pb=races.filter(v=>v.isPB==="예").sort((a,b)=>a.date<b.date?1:-1); el("pbList").innerHTML=pb.length?pb.map(v=>`<p>${escapeHtml(v.date)} · ${escapeHtml(v.raceName)} · ${escapeHtml(v.raceType)} · ${escapeHtml(v.duration||"")} ${v.pace?`(${escapeHtml(v.pace)})`:""}</p>`).join(""):"<p>PB 표시된 대회가 아직 없습니다.</p>"}
function renderLists(){const q=(el("query").value||"").trim().toLowerCase(); const trainings=getTrainings().slice().sort((a,b)=>a.date<b.date?1:-1).filter(v=>[v.date,v.location,v.trainingType,v.memo,v.pain,v.shoe].join(" ").toLowerCase().includes(q)); const races=getRaces().slice().sort((a,b)=>a.date<b.date?1:-1).filter(v=>[v.date,v.raceName,v.raceType,v.memo,v.shoe].join(" ").toLowerCase().includes(q)); el("trainingList").innerHTML=trainings.length?trainings.map(v=>`<div class="entry"><div class="entry-head"><div><div style="font-size:18px;font-weight:700;">${escapeHtml(v.date)}</div><div class="badges"><span class="badge">${escapeHtml(v.trainingType)}</span><span class="badge">${escapeHtml(v.location||"")}</span></div><div class="meta">${v.shoe?`<span>신발 ${escapeHtml(v.shoe)}</span>`:""} ${v.distance?`<span>거리 ${escapeHtml(v.distance)}km</span>`:""} ${v.duration?`<span>시간 ${escapeHtml(v.duration)}</span>`:""} ${v.pace?`<span>페이스 ${escapeHtml(v.pace)}</span>`:""}</div>${v.memo?`<p>${nl2br(escapeHtml(v.memo))}</p>`:""}</div><div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="secondary" onclick="editTraining('${v.id}')">수정</button><button class="danger" onclick="deleteTraining('${v.id}')">삭제</button></div></div></div>`).join(""):"<p>훈련기록이 아직 없습니다.</p>"; el("raceList").innerHTML=races.length?races.map(v=>`<div class="entry"><div class="entry-head"><div><div style="font-size:18px;font-weight:700;">${escapeHtml(v.date)} · ${escapeHtml(v.raceName)}</div><div class="badges"><span class="badge">${escapeHtml(v.raceType)}</span>${v.isPB==="예"?`<span class="badge">PB</span>`:""}</div><div class="meta">${v.shoe?`<span>신발 ${escapeHtml(v.shoe)}</span>`:""} ${v.distance?`<span>거리 ${escapeHtml(v.distance)}km</span>`:""} ${v.duration?`<span>기록 ${escapeHtml(v.duration)}</span>`:""} ${v.pace?`<span>페이스 ${escapeHtml(v.pace)}</span>`:""}</div>${v.memo?`<p>${nl2br(escapeHtml(v.memo))}</p>`:""}</div><div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="secondary" onclick="editRace('${v.id}')">수정</button><button class="danger" onclick="deleteRace('${v.id}')">삭제</button></div></div></div>`).join(""):"<p>대회기록이 아직 없습니다.</p>"}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function nl2br(s){return s.replace(/\n/g,"<br>")}
function activateTab(name){document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===name)); document.querySelectorAll(".tab-panel").forEach(p=>p.classList.toggle("hidden",p.id!==name))}
function renderAll(){renderStats(); renderLists()}
function downloadCSV(){const trainings=getTrainings().map(v=>["훈련",v.date,v.trainingType,v.location||"",v.distance||"",v.duration||"",v.pace||"",v.shoe||"",v.weight||"",v.sleepHours||"",v.memo||""]); const races=getRaces().map(v=>["대회",v.date,v.raceType,v.raceName||"",v.distance||"",v.duration||"",v.pace||"",v.shoe||"",v.weight||"",v.isPB||"",v.memo||""]); const rows=[["구분","날짜","종류","장소/대회명","거리","시간/기록","페이스","러닝화","체중","추가정보","메모"],...trainings,...races]; const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n"); const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=`saebyeok-running-log-v11-${todayStr()}.csv`; a.click(); URL.revokeObjectURL(url)}
function parseCsvLine(line){const result=[]; let current="", inQuotes=false; for(let i=0;i<line.length;i++){const ch=line[i], next=line[i+1]; if(ch=='"'&&inQuotes&&next=='"'){current+='"'; i++;} else if(ch=='"'){inQuotes=!inQuotes;} else if(ch==','&&!inQuotes){result.push(current); current="";} else current+=ch;} result.push(current); return result;}
function importCSVText(text){const lines=text.trim().split(/\r?\n/); if(lines.length<2)return; const rows=lines.map(parseCsvLine); rows.shift(); const trainings=[], races=[]; rows.forEach(r=>{if((r[0]||"")==="훈련"){trainings.push({id:String(Date.now())+Math.random().toString(36).slice(2,8),date:r[1]||"",trainingType:r[2]||"개인훈련",location:r[3]||"",distance:r[4]||"",duration:r[5]||"",pace:r[6]||"",shoe:r[7]||"",weight:r[8]||"",sleepHours:r[9]||"",memo:r[10]||"",strength:"",condition:"보통",pain:""})} else if((r[0]||"")==="대회"){races.push({id:String(Date.now())+Math.random().toString(36).slice(2,8),date:r[1]||"",raceType:r[2]||"풀코스",raceName:r[3]||"",distance:r[4]||"",duration:r[5]||"",pace:r[6]||"",shoe:r[7]||"",weight:r[8]||"",isPB:r[9]||"아니오",memo:r[10]||""})}}); setTrainings([...trainings,...getTrainings()]); setRaces([...races,...getRaces()]); renderAll(); alert("CSV 가져오기가 완료되었습니다.");}
document.addEventListener("DOMContentLoaded",()=>{fillOptions(); resetTrainingForm(); resetRaceForm(); renderAll(); document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>activateTab(btn.dataset.tab))); el("location").addEventListener("change",toggleCustomLocation); el("trainingType").addEventListener("change",applyTrainingPreset); el("raceType").addEventListener("change",applyRacePreset); el("distance").addEventListener("input",autoTrainingPace); el("duration").addEventListener("input",autoTrainingPace); el("raceDistance").addEventListener("input",autoRacePace); el("raceDuration").addEventListener("input",autoRacePace); el("query").addEventListener("input",renderLists); el("csvImport").addEventListener("change",e=>{const f=e.target.files[0]; if(!f)return; f.text().then(importCSVText); e.target.value="";})});
</script>
</body>
</html>
